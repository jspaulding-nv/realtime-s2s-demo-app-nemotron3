name: pellera-riva-s2s

services:
  asr:
    image: ${ASR_IMAGE:-nvcr.io/nim/nvidia/nemotron-asr-streaming:1.2.0}
    container_name: pellera-nemotron-asr
    shm_size: 8gb
    devices:
      - "nvidia.com/gpu=${GPU_ID:-0}"
    environment:
      NGC_API_KEY: ${NGC_API_KEY:?Set NGC_API_KEY in the shell or .env file}
      NIM_HTTP_API_PORT: "9000"
      NIM_GRPC_API_PORT: "50052"
      # English-only, low-memory streaming profile. Punctuation must also be
      # enabled by the ASR client request (enable_automatic_punctuation=true).
      NIM_TAGS_SELECTOR: ${ASR_NIM_TAGS_SELECTOR:-name=nemotron-asr-streaming,type=en-US,batch_size=32}
    ports:
      - "${ASR_HTTP_PORT:-9002}:9000"
      - "${ASR_GRPC_PORT:-50052}:50052"
    volumes:
      - type: bind
        source: ${LOCAL_NIM_CACHE:-./.cache/nim}
        target: /opt/nim/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50052"]
      interval: 10s
      timeout: 10s
      retries: 360
      start_period: 60s

  tts:
    image: ${TTS_IMAGE:-nvcr.io/nim/nvidia/magpie-tts-multilingual:1.7.0}
    container_name: pellera-magpie-tts
    shm_size: 8gb
    devices:
      - "nvidia.com/gpu=${GPU_ID:-0}"
    environment:
      NGC_API_KEY: ${NGC_API_KEY:?Set NGC_API_KEY in the shell or .env file}
      NIM_HTTP_API_PORT: "9000"
      NIM_GRPC_API_PORT: "50053"
      # Smallest Magpie profile; supports streaming and Spanish (es-US).
      NIM_TAGS_SELECTOR: ${TTS_NIM_TAGS_SELECTOR:-name=magpie-tts-multilingual,batch_size=8}
    ports:
      - "${TTS_HTTP_PORT:-9003}:9000"
      - "${TTS_GRPC_PORT:-50053}:50053"
    volumes:
      - type: bind
        source: ${LOCAL_NIM_CACHE:-./.cache/nim}
        target: /opt/nim/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50053"]
      interval: 10s
      timeout: 10s
      retries: 360
      start_period: 60s

  nmt:
    image: ${NMT_IMAGE:-nvcr.io/nim/nvidia/riva-translate-1_6b:1.5.2}
    container_name: pellera-riva-translate-nmt
    shm_size: 8gb
    devices:
      - "nvidia.com/gpu=${GPU_ID:-0}"
    environment:
      NGC_API_KEY: ${NGC_API_KEY:?Set NGC_API_KEY in the shell or .env file}
      NIM_HTTP_API_PORT: "9000"
      NIM_GRPC_API_PORT: "50051"
      # Container DNS names and each service's internal gRPC port.
      NMT_REMOTE_ASR_SERVICE: asr:50052
      NMT_REMOTE_TTS_SERVICE: tts:50053
    ports:
      - "${NMT_HTTP_PORT:-9001}:9000"
      - "${NMT_GRPC_PORT:-50051}:50051"
    volumes:
      - type: bind
        source: ${LOCAL_NIM_CACHE:-./.cache/nim}
        target: /opt/nim/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 10s
      retries: 360
      start_period: 60s
    depends_on:
      asr:
        condition: service_healthy
      tts:
        condition: service_healthy
